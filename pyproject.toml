[project]
name = "know-your-bible"
version = "0.1.0"
description = "Bible verse memorization app with FSRS scheduling"
authors = [
    {name="Jireh Huang"},
]
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cachetools>=5.4",
    "fsrs>=4.3",
    "python-dotenv>=1.0",
    "uuid6>=2024.7",
    "word2number>=1.1",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
ruff = "^0.16.5"
flake8 = "^7.3.0"
pydoclint = "^0.9.1"
mypy = "^2.3.1"
pylint = "^4.0.7"
commitizen = "^4.18.0"
pre-commit = "^4.6.2"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-randomly = "^4.1.0"
pytest-asyncio = "^1.0"
asgi-lifespan = "^2.1"
types-cachetools = ">=5.4"

[tool.poetry.group.scraping]
optional = true

[tool.poetry.group.scraping.dependencies]
nltk = "^3.9"
beautifulsoup4 = "^4.12"
requests = "^2.32"
playwright = "^1.47"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# -------------------
# Tool Configurations
# -------------------

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.ruff]
line-length = 79
target-version = "py312"
fix = true

[tool.ruff.lint]
select = ["B", "D", "E", "ERA", "F", "I", "N", "PL", "RUF", "W"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D205",  # missing-blank-line-after-summary
    "D209"  # new-line-after-last-paragraph
]
"__init__.py" = ["F401"]  # unused-import

# --- Pragmatic suppressions for legacy code (recorded) ---
# Offline scraper scripts under data/ are not part of the runtime app.
"data/**" = ["ALL"]
# Legacy route module: pre-existing docstring/complexity/style debt.
"app/main.py" = [
    "D",       # missing/imperfect docstrings throughout
    "E501",    # long lines
    "PLR",     # complexity/refactor suggestions
    "PLW0108", # lambda over-def in route signatures
    "B006",    # mutable argument defaults (legacy)
    "B008",    # function call in default arg (FastAPI Form)
    "ERA001",  # commented-out legacy code
    "F841",    # unused variables
    "RUF059",  # unused unpacked variable
]
# Legacy data-loading utils: small, isolated style debt.
"app/utils/bible.py" = ["D100", "B006", "E501", "D401", "B007"]
"app/utils/tsk.py" = ["D", "PLR2004", "PLR1704", "E501"]
"app/utils/harmony.py" = ["D100", "D200", "D401", "D205", "E501", "PLR2004"]

[tool.pydoclint]
style = "numpy"
arg-type-hints-in-docstring = false
return-type-hints-in-docstring = false
check-return-types = false
require-return-section-when-returning-nothing = false
skip-checking-raises = true

[tool.pylint.'MESSAGES CONTROL']
disable = ["C0114", "C0115", "C0116"]  # allow missing docstrings in tests
max-line-length = 79

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "."

# --- Pragmatic suppressions for legacy code (recorded) ---
# Legacy route module and offline data scripts: untyped dict juggling.
[[tool.mypy.overrides]]
module = ["app.main", "data.*", "app.utils.bible"]
ignore_errors = true

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true

[tool.pytest.ini_options]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "asyncio: mark a test as an async coroutine test",
    "integration: mark a test as a live integration tests"
]

[tool.coverage.run]
omit = ["tests/*", "data/*"]
